name: Deflate x86 validation

on:
  push:
    branches: [ci/deflate-zlib-rs-x86]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""
  PHOTOCRAFT_NO_PRINT: "1"

jobs:
  compatibility:
    name: Checks (${{ matrix.os }}, x86-64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Check architecture
        shell: bash
        run: |
          test "$RUNNER_ARCH" = X64
          rustc -Vv
      - name: Requested checks (Linux)
        if: runner.os == 'Linux'
        run: |
          nice -n 10 cargo test -p photocraft-io --test deflate_compatibility
          nice -n 10 cargo test -p photocraft-io -p photocraft-codecs -p photocraft-format --locked
          nice -n 10 cargo xtask wasm
      - name: Requested checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          cargo test -p photocraft-io --test deflate_compatibility
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p photocraft-io -p photocraft-codecs -p photocraft-format --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo xtask wasm
          exit $LASTEXITCODE

  benchmark:
    name: Real-photo comparison (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: d95fdf3181c01ad41e95456091a394b105a9afb2
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            candidate
            baseline
          save-if: false
      - name: Build, prepare and compare
        run: bash candidate/.github/scripts/deflate-x86.sh
      - name: Publish measurements
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: deflate-x86-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
